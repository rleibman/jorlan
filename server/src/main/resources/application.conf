jorlan {
  db {
    dataSource {
      driver = "org.mariadb.jdbc.Driver"
      driver = ${?JORLAN_DB_DRIVER}
      url = "jdbc:mariadb://localhost:3306/jorlan"
      url = ${?JORLAN_DB_URL}
      user = "jorlan"
      user = ${?JORLAN_DB_USER}
      password = "jorlan"
      password = ${?JORLAN_DB_PASSWORD}
      maximumPoolSize = 10
      maximumPoolSize = ${?JORLAN_DB_MAX_POOL_SIZE}
      minimumIdle = 2
      minimumIdle = ${?JORLAN_DB_MIN_IDLE}
      connectionTimeoutMillis = 30000
      connectionTimeoutMillis = ${?JORLAN_DB_CONNECTION_TIMEOUT_MILLIS}
      idleTimeoutMillis = 600000
      idleTimeoutMillis = ${?JORLAN_DB_IDLE_TIMEOUT_MILLIS}
      keepaliveTimeMillis = 300000
      keepaliveTimeMillis = ${?JORLAN_DB_KEEPALIVE_TIME_MILLIS}
    }
  }

  flyway {
    locations = ["classpath:sql"]
    enabled = true
    enabled = ${?JORLAN_FLYWAY_ENABLED}
    cleanDisabled = true
    validateOnMigrate = true
    mixed = false
    target = ""
    target = ${?JORLAN_FLYWAY_TARGET}
    baselineOnMigrate = true
    baselineVersion = "0"
    baselineDescription = "Initial"
  }

  http {
    host = "0.0.0.0"
    host = ${?JORLAN_HTTP_HOST}
    port = 8080
    port = ${?JORLAN_HTTP_PORT}
    staticContentDir = "/home/rleibman/projects/jorlan/debugDist"
    staticContentDir = ${?JORLAN_STATIC_CONTENT_DIR}
  }

  ai {
    # "ollama" (local) or "openai" (any OpenAI-compatible API). Examples for provider = "openai":
    #   Google Gemini (free tier):  openAiBaseUrl = "https://generativelanguage.googleapis.com/v1beta/openai"
    #                               openAiModel   = "gemini-2.0-flash"
    #   DeepSeek:                   openAiBaseUrl = "https://api.deepseek.com/v1"
    #                               openAiModel   = "deepseek-chat"
    #   Groq (free tier):           openAiBaseUrl = "https://api.groq.com/openai/v1"
    #                               openAiModel   = "llama-3.3-70b-versatile"
    # Embeddings always stay on local Ollama (the vector index dimensions must not change).
    provider = "ollama"
    provider = ${?JORLAN_AI_PROVIDER}
    openAiBaseUrl = "https://api.openai.com/v1"
    openAiBaseUrl = ${?JORLAN_AI_OPENAI_BASE_URL}
    openAiApiKey = ""
    openAiApiKey = ${?JORLAN_AI_OPENAI_API_KEY}
    openAiModel = "gpt-4o-mini"
    openAiModel = ${?JORLAN_AI_OPENAI_MODEL}
    ollamaBaseUrl = "http://localhost:11434"
    ollamaBaseUrl = ${?JORLAN_AI_OLLAMA_BASE_URL}
    ollamaModel = "llama3.2:3b"
    ollamaModel = ${?JORLAN_AI_OLLAMA_MODEL}
    # Must be large enough for a full pipeline-step prompt (invariants + previous step output + tool
    # specs + ReAct tool-result history). If the prompt exceeds num_ctx, Ollama silently drops the
    # OLDEST tokens -- the system prompt and instructions -- so the model appears to ignore its rules.
    # Do NOT raise without benchmarking: 16384 on this CPU-only box made generation pathologically
    # slow (zero tokens in 26 minutes); 8192 benchmarks healthy.
    numCtx = 8192
    numCtx = ${?JORLAN_AI_NUM_CTX}
    qdrantHost = "localhost"
    qdrantHost = ${?JORLAN_AI_QDRANT_HOST}
    qdrantRPCPort = 6334
    qdrantRPCPort = ${?JORLAN_AI_QDRANT_RPC_PORT}
  }

  agent {
    maxToolSteps = 10
    maxToolSteps = ${?JORLAN_AGENT_MAX_TOOL_STEPS}
  }

  scheduler {
    pollIntervalSeconds = 10
    pollIntervalSeconds = ${?JORLAN_SCHEDULER_POLL_INTERVAL_SECONDS}
    # Must comfortably exceed jobTimeoutSeconds -- TriggerEngine renews the lease before each pipeline
    # step attempt, but a single attempt can run for up to jobTimeoutSeconds before that renewal.
    leaseTtlSeconds = 1200
    leaseTtlSeconds = ${?JORLAN_SCHEDULER_LEASE_TTL_SECONDS}
    # Must comfortably exceed ai.timeout (the LLM completion client's own timeout) -- otherwise
    # TriggerEngine kills a slow-but-legitimate pipeline step before the LLM client's timeout could
    # ever fire, burning a retry cycle for no reason. Keep >= ai.timeout + a few minutes of headroom.
    jobTimeoutSeconds = 900
    jobTimeoutSeconds = ${?JORLAN_SCHEDULER_JOB_TIMEOUT_SECONDS}
    listJobsLimit = 200
    listJobsLimit = ${?JORLAN_SCHEDULER_LIST_JOBS_LIMIT}
    # Jobs executed concurrently per worker. Keep at 1 for a single local Ollama instance:
    # concurrent LLM-bound jobs queue against the model and push each other past the client timeout.
    maxConcurrentJobs = 1
    maxConcurrentJobs = ${?JORLAN_SCHEDULER_MAX_CONCURRENT_JOBS}
  }

  auth {
    secretKey = ${?JORLAN_AUTH_SECRET_KEY}
    # zio-auth code defaults are 1 minute / 5 minutes — far too short for interactive use.
    # Override here to 8 hours access / 30 days refresh.
    accessTTL = 28800000
    accessTTL = ${?JORLAN_AUTH_ACCESS_TTL_MS}
    refreshTTL = 2592000000
    refreshTTL = ${?JORLAN_AUTH_REFRESH_TTL_MS}
    # Set to false for local dev (HTTP); override to true in production (HTTPS).
    secureCookie = false
    secureCookie = ${?JORLAN_AUTH_SECURE_COOKIE}
  }

  google {
    clientId = ""
    clientId = ${?JORLAN_GOOGLE_CLIENT_ID}
    clientSecret = ""
    clientSecret = ${?JORLAN_GOOGLE_CLIENT_SECRET}
    redirectUri = "http://localhost:8080/api/oauth/callback/google"
    redirectUri = ${?JORLAN_GOOGLE_REDIRECT_URI}
  }
}
